        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 1.5rem;
      }
      .scroll {
        overflow-x: auto;
      }
      svg {
        width: 100%;
        min-width: 832px;
        display: block;
      }
